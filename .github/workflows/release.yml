name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # No dependency cache in the publish job (setup-node's trusted-
          # publishing guidance: keep credentials out of cache scope).
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version matches tag
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in packages/*/package.json; do
            PKG_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('$pkg','utf8')).version")
            if [ "$PKG_VERSION" != "$TAG" ]; then
              echo "❌ Version mismatch in $pkg: expected $TAG, got $PKG_VERSION"
              exit 1
            fi
          done
          echo "✅ All versions match tag $TAG"

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Publishes through npm Trusted Publishing (OIDC): no token, the
      # `id-token: write` permission above is what authenticates. pnpm
      # hands the packed tarball to the npm CLI on PATH, and OIDC needs
      # npm >= 11.5.1, so make sure of the CLI rather than trust the
      # runner's bundled copy.
      - name: Ensure an OIDC-capable npm
        run: npm install -g npm@^11 && npm --version

      - name: Publish
        run: pnpm publish -r --access public --no-git-checks --provenance

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
